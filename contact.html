<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact | Intralink Tech</title>
  <meta
    name="description"
    content="Request a free quotation for CCTV, Wi-Fi, networking, websites and IT support."
  >
  <link rel="canonical" href="https://intralinktechnologies.co.uk/contact">
  <meta property="og:title" content="Contact Intralink Tech">
  <meta
    property="og:description"
    content="Request a free quotation from Intralink Tech."
  >
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://intralinktechnologies.co.uk/contact">
  <meta
    property="og:image"
    content="https://intralinktechnologies.co.uk/imageslogo.png"
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <div class="bg"></div>
  <canvas id="net" aria-hidden="true"></canvas>

  <nav aria-label="Main navigation">
    <a href="index.html" class="brand" aria-label="Intralink Tech home">
      <img src="imageslogo-transparent.png" alt="Intralink Tech">
    </a>

    <div class="links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="solutions.html">Solutions</a>
      <a href="industries.html">Industries</a>
      <a aria-current="page" href="contact.html">Contact</a>
    </div>
  </nav>

  <main>
    <section class="hero page-hero">
      <div>
        <span class="badge">START A CONVERSATION</span>
        <h1>Request a Free Quote</h1>
        <p>Tell us about your project and we&rsquo;ll get back to you as soon as possible.</p>
      </div>
    </section>

    <section class="cta panel">
      <h2>How can we help?</h2>

      <form id="contactForm" class="contact-form" novalidate>
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="phone">Phone number <span>(optional)</span></label>
        <input id="phone" name="phone" type="tel" autocomplete="tel">

        <label for="service">Service required</label>
        <select id="service" name="service" required>
          <option value="">Select a service</option>
          <option>CCTV Systems</option>
          <option>Enterprise Wi-Fi</option>
          <option>Networking</option>
          <option>Structured Cabling</option>
          <option>Racks &amp; Cabinets</option>
          <option>Software Configuration</option>
          <option>Website Design &amp; Development</option>
          <option>IT Support for Homes, Offices &amp; Small Businesses</option>
          <option>General Enquiry</option>
        </select>

        <label for="message">Tell us about your project</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button class="btn primary" type="submit">Request Quote</button>
      </form>
    </section>
  </main>

  <footer>
    &copy; 2026 Intralink Tech &middot;
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="contact.html">Contact</a>
  </footer>

  <script src="assets/js/site.js"></script>
</body>
</html>
